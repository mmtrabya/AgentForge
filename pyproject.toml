[project]
name = "skillforge-data"
version = "0.1.0"
description = "SkillForge Data Engineering: crawling, processing, knowledge store"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "datasketch>=1.6",
    "tree-sitter>=0.23",
    "GitPython>=3.1",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = []
