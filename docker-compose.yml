services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: skillforge-postgres
    environment:
      POSTGRES_USER: skillforge
      POSTGRES_PASSWORD: skillforge_dev
      POSTGRES_DB: skillforge
    ports:
      - "5433:5432"  # 5433 so it does not clash with the local PostgreSQL on 5432
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillforge -d skillforge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
